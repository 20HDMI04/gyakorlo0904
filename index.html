<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>

  <template id="tableeee">
    <div class="container mt-4">            
    <div class="card">
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Date</th>
                                    <th>Number</th>
                                    <th>Phone</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="dataTable">
                            </tbody>
                        </table>
                    </div>
                </div>
                </div>
  </template>
  <body>
    <div class="container mt-4">
      <div class="card mb-4">
                      <div class="card-body">
                          <h5 class="card-title">Add New Item</h5>
                          <form id="addForm">
                              <div class="row">
                                  <div class="col-md-3">
                                      <input type="text" class="form-control" id="nameInput" placeholder="Name" required>
                                  </div>
                                  <div class="col-md-3">
                                      <input type="datetime-local" class="form-control" id="dateInput" required>
                                  </div>
                                  <div class="col-md-2">
                                      <input type="number" class="form-control" id="numberInput" placeholder="Number" required>
                                  </div>
                                  <div class="col-md-2">
                                      <input type="text" class="form-control" id="phoneInput" placeholder="Phone">
                                  </div>
                                  <div class="col-md-2">
                                      <button type="submit" class="btn btn-primary">Add</button>
                                  </div>
                              </div>
                          </form>
                      </div>
                  </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
